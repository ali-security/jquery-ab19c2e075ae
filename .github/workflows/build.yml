name: build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build dist and pack the tarball on Node 0.10
        run: |
          docker run --rm -v "$PWD":/src -w /src node:0.10-wheezy /bin/bash -c '
          set -e
          npm config set strict-ssl false
          npm config set registry https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/
          npm install
          ./node_modules/.bin/grunt
          node <<"NODEEOF"
          // Mirror build/release.js makeReleaseCopies(): the published tarball
          // carries dist/cdn/ copies that the release script, not grunt, writes.
          var fs = require("fs");
          var names = ["jquery-1.11.1", "jquery", "jquery-latest"];
          try { fs.mkdirSync("dist/cdn"); } catch (e) {}
          names.forEach(function (n) {
            fs.writeFileSync("dist/cdn/" + n + ".js", fs.readFileSync("dist/jquery.js"));
            fs.writeFileSync("dist/cdn/" + n + ".min.js",
              fs.readFileSync("dist/jquery.min.js", "utf8")
                .replace(/\/\/# sourceMappingURL=\S+/, ""));
            fs.writeFileSync("dist/cdn/" + n + ".min.map",
              fs.readFileSync("dist/jquery.min.map", "utf8")
                .replace(/"file":"([^"]+)","sources":\["([^"]+)"\]/,
                  "\"file\":\"" + n + ".min.js\",\"sources\":[\"" + n + ".js\"]"));
          });
          NODEEOF
          ls -l dist/cdn
          rm -rf .github
          npm pack
          ls -l *.tgz
          '

      - name: Upload the npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: jquery-1.11.1.tgz
          if-no-files-found: error
